<header class="bg-light py-3 shadow-sm rounded-bottom">
  <div class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-between">

      <!-- Logo + Título -->
      <a routerLink="/" class="d-flex align-items-center mb-2 mb-lg-0 text-dark text-decoration-none fs-4 fw-bold">
        {{ title }}
      </a>

      <!-- Navegación -->
      <ul class="nav me-auto ms-4">
        <li><a routerLink="/" class="nav-link px-3 text-dark">Inicio</a></li>

        <!-- Si CLIENTE logueado -->
        <ng-container *ngIf="(isLoggedIn$ | async) && rolActual === 'ROLE_CLIENTE'">
          <li><a routerLink="/reportes" class="nav-link px-3 text-dark">Reportes</a></li>
          <li><a routerLink="/mis-reportes" class="nav-link px-3 text-dark">Mis reportes</a></li>
          <li><a routerLink="/crear-reporte" class="nav-link px-3 text-dark">Crear reporte</a></li>
        </ng-container>

        <!-- Si MODERADOR logueado -->
        <ng-container *ngIf="(isLoggedIn$ | async) && rolActual === 'ROLE_MODERADOR'">
          <li><a routerLink="/reportes" class="nav-link px-3 text-dark">Reportes</a></li>
          <li><a routerLink="/gestionar-reporte" class="nav-link px-3 text-dark">Gestionar Reporte</a></li>
          <li><a routerLink="/categorias" class="nav-link px-3 text-dark">Categorías</a></li>
        </ng-container>
      </ul>

      <!-- Botones a la derecha -->
      <div class="text-end">

        <!-- Si NO está logueado -->
        <ng-container *ngIf="(isLoggedIn$ | async) === false">
          <button routerLink="/login" class="btn btn-outline-dark me-2">
            <i class="fas fa-user"></i> Iniciar sesión
          </button>
          <button routerLink="/registro" class="btn btn-success">Registro</button>
        </ng-container>

        <!-- Si SÍ está logueado -->
        <ng-container *ngIf="(isLoggedIn$ | async)">
          <div routerLink="/perfil" class="btn btn-success rounded-pill px-4 text-white fw-semibold">
            Bienvenido<br />
            {{ fechaActual }}
          </div>
          <button (click)="logout()" class="btn btn-danger ms-2">
            <i class="fas fa-sign-out-alt"></i> Cerrar sesión
          </button>
        </ng-container>

      </div>
    </div>
  </div>
</header>
