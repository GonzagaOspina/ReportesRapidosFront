<div class="container mt-5" style="max-width: 600px;">
  <div class="card shadow-sm p-4">
    <h4 class="mb-4 text-center">📝 Crear Reporte</h4>

    <form [formGroup]="crearReporteForm" (ngSubmit)="crearReporte()">
      
      <!-- Título -->
      <div class="mb-3">
        <label class="form-label">Título</label>
        <input formControlName="titulo" type="text" class="form-control" placeholder="Título del reporte" />
      </div>

      <!-- Descripción -->
      <div class="mb-3">
        <label class="form-label">Descripción del problema</label>
        <textarea formControlName="descripcion" class="form-control" rows="3" placeholder="Describe lo ocurrido..."></textarea>
      </div>

      <!-- Categoría -->
      <div class="mb-3">
        <label class="form-label">Categoría</label>
        <select formControlName="categoria" class="form-select">
          <option value="">Seleccione una categoría</option>
          <option *ngFor="let c of categorias" [value]="c.id">{{ c.nombre }}</option>
        </select>
        <div *ngIf="categoriaSeleccionadaDescripcion" class="form-text mt-1 fst-italic text-muted">
          {{ categoriaSeleccionadaDescripcion }}
        </div>
      </div>

      <!-- Ciudad -->
<div class="mb-3">
  <label class="form-label">Ciudad</label>
<select formControlName="ciudad" class="form-select">
  <option value="">Seleccione una ciudad</option>
  <option *ngFor="let ciudad of ciudades" [value]="ciudad[0]">
    {{ ciudad[1] }}
  </option>
</select>
</div>


      <!-- Mapa -->
      <div class="mb-3">
        <label class="form-label">Ubicación</label>
        <div id="mapa" style="height: 250px; border: 1px solid #ccc; border-radius: 5px;"></div>
      </div>

      <!-- Imágenes -->
      <div class="mb-3">
        <label class="form-label">Subir imágenes</label>
        <input type="file" multiple (change)="onArchivoSeleccionado($event)" class="form-control" />
        <div *ngIf="cargandoImagen" class="form-text text-primary mt-2">⏳ Subiendo imagen...</div>

        <div *ngIf="imagenesUrl.length > 0" class="mt-2">
          <p class="mb-1 text-success fw-bold">✅ Imágenes subidas:</p>
          <div class="d-flex flex-wrap">
            <img *ngFor="let url of imagenesUrl" [src]="url" width="100" class="me-2 mb-2 rounded shadow-sm" />
          </div>
        </div>
      </div>

      <!-- Botón enviar -->
      <div class="d-grid">
        <button type="submit" class="btn btn-success">Crear reporte</button>
      </div>
    </form>
  </div>
</div>
