<div class="recuperar-wrapper">
  <div class="recuperar-card">
    <h2>🔑 Recuperar contraseña</h2>

    <!-- Paso 1: Ingresar correo -->
    <form *ngIf="paso === 1" [formGroup]="recuperarForm" (ngSubmit)="enviarCodigo()">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" class="form-input" required />

      <button type="submit" class="btn btn-success" [disabled]="cargando">📩 Enviar código</button>
    </form>

    <!-- Paso 2: Ingresar código y nueva contraseña -->
    <form *ngIf="paso === 2" [formGroup]="nuevaPasswordForm" (ngSubmit)="cambiarPassword()">
      <label for="codigo">Código de verificación</label>
      <input id="codigo" type="text" formControlName="codigo" class="form-input" required />

      <label for="nuevoPassword">Nueva contraseña</label>
      <input id="nuevoPassword" type="password" formControlName="nuevoPassword" class="form-input" required />

      <button type="submit" class="btn btn-success" [disabled]="cargando">🔐 Cambiar contraseña</button>
    </form>

    <p *ngIf="error" class="alert alert-danger">{{ error }}</p>
  </div>
</div>
